name: Check CFlareAIProxy

on:
  pull_request:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          show-progress: false
      - name: Apply and clean provider cycle fix
        run: |
          python .github/pr40-provider-cycle-fix.py
          git show HEAD^:.github/workflows/check.yml > .github/workflows/check.yml
          rm .github/pr40-provider-cycle-fix.py
          git diff --check
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run standard validation
        run: pnpm run check
      - name: Build production web bundle
        run: pnpm run build:web
      - name: Wrangler dry run
        run: pnpm run config:check
      - name: Commit validated provider cycle fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix provider model refresh cycle progress"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
