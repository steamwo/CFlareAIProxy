name: Check CFlareAIProxy

on:
  pull_request:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - name: Apply review fixes
        run: |
          python .github/pr37-fix-hotfix.py
          python .github/pr37-fix.py
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run standard validation
        run: |
          set +e
          pnpm run check > validation-error.log 2>&1
          status=$?
          cat validation-error.log
          if [ "$status" -ne 0 ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add validation-error.log
            git commit -m "record PR 37 validation failure"
            git push origin HEAD:${{ github.event.pull_request.head.ref }}
            exit "$status"
          fi
