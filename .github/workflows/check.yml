name: Check CFlareAIProxy

on:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 1
          show-progress: false
      - name: Apply review fixes
        run: |
          python .github/pr37-fix-hotfix.py
          python .github/pr37-fix.py
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run standard validation
        id: validation
        continue-on-error: true
        run: pnpm run check > validation-error.log 2>&1
      - name: Upload validation log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr37-validation-error
          path: validation-error.log
          if-no-files-found: error
      - name: Enforce result
        if: always()
        run: test "${{ steps.validation.outcome }}" = success
