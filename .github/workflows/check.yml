name: Check CFlareAIProxy

on:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 1
          show-progress: false
      - name: Diagnose model refresh patch
        run: |
          python .github/pr40-model-refresh-hotfix.py
          set -o pipefail
          python .github/pr40-model-refresh-fix.py 2>&1 | tail -1
