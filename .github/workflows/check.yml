name: Check CFlareAIProxy

on:
  pull_request:
  push:
    branches: [main, dev]

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref }}
          fetch-depth: 0
      - name: Apply PR 37 review fixes
        if: ${{ hashFiles('.github/pr37-fix.py') != '' }}
        run: |
          python .github/pr37-fix.py
          rm -f .github/pr37-fix.py .github/workflows/apply-pr37-review-fixes.yml
          git show "${{ github.event.pull_request.base.sha }}:.github/workflows/check.yml" > .github/workflows/check.yml
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      # Incremental caches. Every check step keeps continue-on-error so one run
      # still reports all failing dimensions; caching only trims repeated work.
      # tsconfig.worker.json sets composite:true, so tsc --noEmit still writes
      # tsconfig.worker.tsbuildinfo and can skip unchanged files on re-runs.
      # vue-tsc has no incremental output here (web/tsconfig.json is not
      # composite), so only the worker project benefits.
      - name: Restore TypeScript incremental cache
        uses: actions/cache@v4
        with:
          path: tsconfig.worker.tsbuildinfo
          key: tsbuildinfo-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'tsconfig.worker.json') }}-${{ github.sha }}
          restore-keys: |
            tsbuildinfo-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'tsconfig.worker.json') }}-
            tsbuildinfo-${{ runner.os }}-
      - name: Restore Vitest cache
        uses: actions/cache@v4
        with:
          path: node_modules/.vite/vitest
          key: vitest-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'vitest.config.ts') }}-${{ github.sha }}
          restore-keys: |
            vitest-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'vitest.config.ts') }}-
            vitest-${{ runner.os }}-
      - name: Check configuration
        id: config
        continue-on-error: true
        run: |
          set -o pipefail
          node scripts/check-config.mjs 2>&1 | tee config-check.log
      - name: Check web assets
        id: web
        continue-on-error: true
        run: |
          set -o pipefail
          node scripts/check-web.mjs 2>&1 | tee web-check.log
      - name: Typecheck worker and web
        id: types
        continue-on-error: true
        run: |
          set -o pipefail
          pnpm run typecheck 2>&1 | tee typecheck.log
      - name: Run tests
        id: tests
        continue-on-error: true
        run: pnpm exec vitest run --reporter=json --outputFile=vitest-results.json
      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vitest-results
          path: vitest-results.json
          if-no-files-found: ignore
      - name: Build production web bundle
        id: build
        continue-on-error: true
        run: |
          set -o pipefail
          pnpm run build:web 2>&1 | tee build-web.log
      - name: Wrangler dry run
        id: wrangler
        continue-on-error: true
        run: |
          set -o pipefail
          pnpm run config:check 2>&1 | tee wrangler.log
      - name: Upload validation logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validation-logs
          path: |
            config-check.log
            web-check.log
            typecheck.log
            build-web.log
            wrangler.log
          if-no-files-found: ignore
      - name: Enforce validation results
        if: always()
        run: |
          if [ "${{ steps.config.outcome }}" != "success" ] \
            || [ "${{ steps.web.outcome }}" != "success" ] \
            || [ "${{ steps.types.outcome }}" != "success" ] \
            || [ "${{ steps.tests.outcome }}" != "success" ] \
            || [ "${{ steps.build.outcome }}" != "success" ] \
            || [ "${{ steps.wrangler.outcome }}" != "success" ]; then
            exit 1
          fi
      - name: Commit validated fixes
        if: ${{ hashFiles('.github/pr37-fix.py') == '' && github.event_name == 'pull_request' && github.actor != 'github-actions[bot]' }}
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix PR 37 review findings"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
