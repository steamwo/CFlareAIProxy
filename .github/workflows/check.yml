name: Check CFlareAIProxy

on:
  pull_request:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          show-progress: false
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Capture validation error
        run: |
          python .github/pr40-provider-refresh-fix.py
          set +e
          pnpm run check > /tmp/pr40-provider-validation.log 2>&1
          status=$?
          tail -120 /tmp/pr40-provider-validation.log > /tmp/pr40-provider-error.txt
          git reset --hard HEAD
          cp /tmp/pr40-provider-error.txt pr40-provider-error.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pr40-provider-error.txt
          git commit -m "record provider refresh validation error" || true
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
          exit "$status"
