name: Check CFlareAIProxy

on:
  pull_request:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          show-progress: false
      - name: Record model refresh patch error
        run: |
          set +e
          python .github/pr40-model-refresh-hotfix.py
          python .github/pr40-model-refresh-fix.py > pr40-patch.log 2>&1
          status=$?
          tail -1 pr40-patch.log > pr40-patch-error.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pr40-patch-error.txt
          git commit -m "record PR 40 patch error" || true
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
          exit "$status"
