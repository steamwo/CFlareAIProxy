name: Check CFlareAIProxy

on:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          show-progress: false
      - name: Apply dynamic progress fix
        run: |
          python .github/pr40-dynamic-progress-fix.py
          git show HEAD~3:.github/workflows/check.yml > .github/workflows/check.yml
          rm .github/pr40-dynamic-progress-fix.py
          git diff --check
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run validation
        id: validation
        continue-on-error: true
        run: pnpm run check > validation-error.log 2>&1
      - name: Upload validation error
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dynamic-progress-validation
          path: validation-error.log
          if-no-files-found: error
      - name: Enforce validation
        if: always()
        run: test "${{ steps.validation.outcome }}" = success
