name: Apply SOCKS4 patch on PR branch

on:
  push:
    branches: [agent/restore-socks4-proxy]
  pull_request:
    branches: [dev]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/restore-socks4-proxy
      - name: Apply implementation
        run: |
          sed -i 's/HTTP CONNECT 状态、SOCKS5 认证结果/CONNECT 状态、SOCKS5 认证结果/' .github/scripts/apply-socks4.py
          python3 .github/scripts/apply-socks4.py
      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Restore native SOCKS4 proxy support"
          git push origin HEAD:agent/restore-socks4-proxy
