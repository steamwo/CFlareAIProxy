name: Finalize and validate native SOCKS4 support

on:
  push:
    branches: [agent/restore-socks4-proxy]

permissions:
  contents: write

jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/restore-socks4-proxy
      - name: Align documentation and error vocabulary
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          replacements = {
              Path('src/credential-fetch.ts'): {
                  'Credential proxy username or password is too long': 'Credential SOCKS username, password, or USERID is too long or invalid',
                  'Credential SOCKS5 proxy failed to connect, code ${code}': 'Credential SOCKS proxy failed to connect, code ${code}',
              },
              Path('src/upstream-fetch.ts'): {
                  'SOCKS5 用户名或密码过长': 'SOCKS 用户名、密码或 USERID 过长或无效',
                  'SOCKS5 连接上游失败，代码 ${code}': 'SOCKS 代理连接上游失败，代码 ${code}',
                  '标准 CONNECT/SOCKS5 代理': '标准 CONNECT/SOCKS 代理',
              },
              Path('README.md'): {
                  'Worker 原生 HTTP CONNECT / SOCKS5；': 'Worker 原生 HTTP CONNECT / SOCKS4/4a / SOCKS5；',
                  'http://user:pass@host:port\nsocks5://user:pass@host:port\nsocks5h://user:pass@host:port': 'http://user:pass@host:port\nsocks4://user@host:port\nsocks4a://user@host:port\nsocks5://user:pass@host:port\nsocks5h://user:pass@host:port',
              },
          }
          for path, mapping in replacements.items():
              text = path.read_text()
              for old, new in mapping.items():
                  if old not in text:
                      raise SystemExit(f'missing marker in {path}: {old}')
                  text = text.replace(old, new, 1)
              path.write_text(text)
          PY
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Check configuration
        run: node scripts/check-config.mjs
      - name: Check web assets
        run: node scripts/check-web.mjs
      - name: Typecheck worker and web
        run: pnpm run typecheck
      - name: Run tests
        run: pnpm exec vitest run
      - name: Build production web bundle
        run: pnpm run build:web
      - name: Wrangler dry run
        run: pnpm run config:check
      - name: Commit validated implementation
        run: |
          git rm .github/workflows/agent-socks4-validate.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md src/credential-fetch.ts src/upstream-fetch.ts
          git commit -m "Finalize native SOCKS4 proxy support"
          git push origin HEAD:agent/restore-socks4-proxy
