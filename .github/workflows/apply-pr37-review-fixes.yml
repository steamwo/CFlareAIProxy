name: Apply PR 37 review fixes

on:
  push:
    branches:
      - agent/fix-pr37-review-findings

permissions:
  contents: write

jobs:
  apply-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: pnpm
      - name: Apply fixes
        run: python .github/pr37-fix.py
      - name: Remove bootstrap files
        run: rm .github/pr37-fix.py .github/workflows/apply-pr37-review-fixes.yml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Validate
        run: |
          git diff --check
          pnpm run check
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix PR 37 review findings"
          git push origin HEAD:agent/fix-pr37-review-findings
