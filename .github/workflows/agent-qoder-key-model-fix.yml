name: Validate Qoder gateway-key model names

on:
  push:
    branches: [agent/qoder-display-name-routing]
  pull_request:
    branches: [dev]
    types: [opened, reopened, synchronize]

permissions:
  contents: write

jobs:
  validate-and-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout branch
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: git clone --quiet --depth 1 --branch agent/qoder-display-name-routing "https://x-access-token:${GITHUB_TOKEN}@github.com/steamwo/CFlareAIProxy.git" repo
      - name: Apply gateway-key model fix
        working-directory: repo
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path("scripts/agent-fix-qoder-key-models.py")
          text = path.read_text()
          old = '''    count = text.count(old)\n    if count != 1:\n        raise SystemExit(f"{path}: expected one match, found {count}")\n    target.write_text(text.replace(old, new))'''
          new = '''    count = text.count(old)\n    if count == 0:\n        raise SystemExit(f"{path}: expected one match, found 0")\n    if count > 1:\n        if path == "src/admin.ts" and old.startswith("    const expiresAt = body.expiresAt"):\n            head, separator, tail = text.rpartition(old)\n            target.write_text(head + new + tail)\n            return\n        raise SystemExit(f"{path}: expected one match, found {count}")\n    target.write_text(text.replace(old, new))'''
          if text.count(old) != 1:
              raise SystemExit("replacement helper context not found")
          path.write_text(text.replace(old, new))
          PY
          python3 scripts/agent-fix-qoder-key-models.py
          rm scripts/agent-fix-qoder-key-models.py .github/workflows/agent-qoder-key-model-fix.yml
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: pnpm
          cache-dependency-path: repo/pnpm-lock.yaml
      - name: Install dependencies
        working-directory: repo
        run: pnpm install --frozen-lockfile
      - name: Run repository checks
        working-directory: repo
        run: pnpm run check
      - name: Build production web bundle
        working-directory: repo
        run: pnpm run build:web
      - name: Run Wrangler dry run
        working-directory: repo
        run: pnpm run config:check
      - name: Commit validated fix
        working-directory: repo
        run: |
          git config user.name "openai-agent"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/qoder-model-routing.ts src/db.ts src/admin.ts \
            web/src/types.ts web/src/views/KeysView.vue \
            web/src/utils/model-selection.ts web/src/utils/model-selection.test.ts \
            test/qoder-model-routing.test.ts docs/qoder-model-routing.md
          git add -u .github/workflows/agent-qoder-key-model-fix.yml scripts/agent-fix-qoder-key-models.py
          git commit -m "Normalize Qoder models in gateway keys"
          git push origin HEAD:agent/qoder-display-name-routing
