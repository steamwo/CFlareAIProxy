name: Validate Qoder display-name routing

on:
  push:
    branches: [agent/qoder-display-name-routing]
  pull_request:
    branches: [dev]
    types: [opened, reopened, synchronize]

permissions:
  contents: write

jobs:
  validate-and-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout branch
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: git clone --quiet --depth 1 --branch agent/qoder-display-name-routing "https://x-access-token:${GITHUB_TOKEN}@github.com/steamwo/CFlareAIProxy.git" repo
      - name: Apply proposed changes
        working-directory: repo
        run: |
          git apply --recount --verbose --check agent-qoder-routing.patch
          git apply --recount --verbose agent-qoder-routing.patch
          rm agent-qoder-routing.patch .github/workflows/agent-qoder-display-routing.yml
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: pnpm
          cache-dependency-path: repo/pnpm-lock.yaml
      - name: Install dependencies
        working-directory: repo
        run: pnpm install --frozen-lockfile
      - name: Run repository checks
        working-directory: repo
        run: pnpm run check
      - name: Build production web bundle
        working-directory: repo
        run: pnpm run build:web
      - name: Run Wrangler dry run
        working-directory: repo
        run: pnpm run config:check
      - name: Commit validated changes
        working-directory: repo
        run: |
          git config user.name "openai-agent"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add automatic Qoder display-name routing"
          git push origin HEAD:agent/qoder-display-name-routing
