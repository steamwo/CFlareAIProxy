name: Validate Qoder display-name routing

on:
  push:
    branches: [agent/qoder-display-name-routing]
  pull_request:
    branches: [dev]
    types: [opened, reopened, synchronize]

permissions:
  contents: write

jobs:
  validate-and-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout branch
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: git clone --quiet --depth 1 --branch agent/qoder-display-name-routing "https://x-access-token:${GITHUB_TOKEN}@github.com/steamwo/CFlareAIProxy.git" repo
      - name: Apply proposed changes
        working-directory: repo
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          patch_path = Path("agent-qoder-routing.patch")
          patch = patch_path.read_text()
          filtered = re.sub(
              r"diff --git a/src/proxy-v2\.ts b/src/proxy-v2\.ts\n.*?(?=diff --git a/test/qoder-model-routing\.test\.ts)",
              "",
              patch,
              flags=re.S,
          )
          Path("agent-qoder-filtered.patch").write_text(filtered)

          proxy_path = Path("src/proxy-v2.ts")
          proxy = proxy_path.read_text()
          old_import = 'import { authenticateGatewayKey, getCredential, getProvider, listCredentialAvailabilityForModel, listRoutesForModel, setCredentialError } from "./db";'
          new_import = 'import { authenticateGatewayKey, gatewayKeyAllowsModel, getCredential, getProvider, listCredentialAvailabilityForModel, listRoutesForModel, setCredentialError } from "./db";'
          old_check = 'if (allowedModels.length > 0 && !allowedModels.includes(publicModel)) {'
          new_check = 'if (!await gatewayKeyAllowsModel(c.env, publicModel, allowedModels)) {'
          if proxy.count(old_import) != 1 or proxy.count(old_check) != 1:
              raise SystemExit("proxy-v2.ts expected context not found")
          proxy_path.write_text(proxy.replace(old_import, new_import).replace(old_check, new_check))
          PY
          git apply --recount --verbose --check agent-qoder-filtered.patch
          git apply --recount --verbose agent-qoder-filtered.patch
          rm agent-qoder-routing.patch agent-qoder-filtered.patch .github/workflows/agent-qoder-display-routing.yml
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: pnpm
          cache-dependency-path: repo/pnpm-lock.yaml
      - name: Install dependencies
        working-directory: repo
        run: pnpm install --frozen-lockfile
      - name: Run repository checks
        working-directory: repo
        run: pnpm run check
      - name: Build production web bundle
        working-directory: repo
        run: pnpm run build:web
      - name: Run Wrangler dry run
        working-directory: repo
        run: pnpm run config:check
      - name: Commit validated changes
        working-directory: repo
        run: |
          git config user.name "openai-agent"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add automatic Qoder display-name routing"
          git push origin HEAD:agent/qoder-display-name-routing
